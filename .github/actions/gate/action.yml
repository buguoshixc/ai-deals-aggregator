name: 'Gate（完整门禁）'
description: >-
  collect → validate → 译文 → 两个自测 → build → 真浏览器验收 → 回归比对的**唯一实现**。
  verify.yml（PR/push）、deploy.yml（发布前）、collect.yml（提交数据前）都调用这一个文件，
  避免出现两套相似但不同的测试链。

# 为什么是复合 action 而不是 reusable workflow（2026-09-28 的决定，附理由）：
#  ① **检查名不能变**。verify.yml 的 job 名 `gate` 是分支保护要填的必需检查名；
#     换成 reusable 调用后，被调 job 的检查名会变成 `<调用方 job> / <被调 job>`
#     这种形态，只能等第一次 CI 跑完读 check-runs 才知道，而且 deploy.yml 再建一个同名
#     job 就会在同一 SHA 上出现两个同名检查。
#  ② `scripts/tools/check-ci-consistency.js` 把「期望项数的唯一出处」钉在 verify.yml 的
#     一行 `run:`（`--expect-checks=N`）上；gate job 一旦变成 `uses:` 调用就没有 steps，
#     那套机制必须改写。复合 action 下它一个字都不用动。
#  ③ 新增 workflow 文件会同时触发 (0b) 登记、(1)/(1b) 全文件 uses 扫描、
#     (3c)/(4) 必须有 runs-on 与 setup-node+node-version 等一串约束；
#     复合 action 不在 `.github/workflows/` 的扫描面里，改动面小一个量级。
#  代价：调用方各自保留 checkout / setup-node / runs-on / timeout（各 3 行）。
#
# ⚠️ 调用方约定：**先 checkout、再 setup-node**，然后调用本 action。
#    本 action 从 `npm ci` 开始（真浏览器验收需要 playwright-core，采集与发布路径因此
#    都依赖 npm registry —— 这条写进了 README）。
# ⚠️ 本 action 里**没有 continue-on-error**：需要「不判死」的只有浏览器准备一步，
#    它自身逻辑走到 `exit 0`；唯一的判定点是紧随其后的「浏览器可用性判定」。

inputs:
  allow_degraded_run:
    description: >-
      仅人工触发时可用：'true' = 浏览器装不上也放行静态门禁，并在 Summary 与注解里
      明确写出「本次没有做真浏览器验收」。PR / push / 定时采集一律传 'false'。
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # 依赖：真浏览器验收需要 playwright-core；下面「准备浏览器」那步要读它的版本号。
    - name: Install dependencies
      shell: bash
      run: npm ci

    # 架构不变量（architecture-modernization-v1 新增，4 条）。
    #
    # 为什么排在数据门禁之前：它**不需要任何数据、也不需要 dist**（纯源码 / 声明表检查，
    # 实测 <0.1s），红的时候是「结构被改坏了」而不是「数据不对」——先跑它能让
    # 「改坏了骨架」这一类失败在最快的步骤上就定位，不必等一分钟的浏览器验收。
    #
    # 守的四条（每一条都必须满足「真实边界 + 没有别人会红 + 今天真的成立」，见 scripts/test/fitness.js 头注释）：
    #   ① scripts/lib/** 不得依赖 scripts/{build,tools,ai}/**
    #   ② 页面正文/页壳模块不读盘、不联网、不看当前时间（时间必须 context 注入）
    #   ③ 生产模块里只有 lib/page-shell.js 产出 <!DOCTYPE（本轮之前是 9 处）
    #   ④ 分层表 scripts/test/layers.js 无幽灵条目、每个 selftest:* 恰好属于一层
    #
    # 刻意**不收**的几条（避免同一不变量重复证明）：无循环依赖（实测恒 0）、布局族声明
    # （已由 page-kinds.assertLayoutDeclarations + seo-selftest + verify-site §22c 三处把守）、
    # 产物注册表闭包（构建期 selfCheck 是 owner）、每个测试被门禁跑到（check-ci-consistency (17)(19) 是 owner）。
    - name: Architecture fitness (structure invariants)
      shell: bash
      run: node scripts/test/fitness.js

    # 证据政策门禁（Tier-3 拦截）：`research/` 的临时过程产物不许进 Git —— 见 docs/EVIDENCE-POLICY.md。
    #
    # 为什么它必须存在：`.gitignore` 只能拦**未跟踪**的文件，而一个已经 `git add` 的探针 dump
    # 不会因为它被忽略而消失。原先靠「逐目录白名单 + 记得别 add」维持，漏补的症状是
    # 「几十 MB 的第三方正文静默进仓库」，且没有任何门禁会红（实测 research/ 已跟踪 2,190 个文件）。
    # 这条判据**只管未来**：基线（e0ca04a）时已跟踪的 1,283 个 Tier-3 文件全部 grandfather 放行，
    # 不删、不 untrack、不重写历史。
    - name: Evidence policy (Tier-3 interception)
      shell: bash
      run: node scripts/tools/check-evidence.js

    # 数据门禁：collect.yml 采集后跑的就是这一条（strict），PR/发布路径同样要过。
    - name: Validate data (strict)
      shell: bash
      run: node scripts/validate.js --strict

    # 可重建性门禁（v1.1 收口补）：`deals.json` 里不许有「没有任何源」的值。
    #
    # 为什么它是独立一步、而不是并进 strict：两者问的是不同问题，红的时候处置方式也不同。
    # strict 问「值合不合法」；这一条问「这个值是谁说的」——把六字段剥掉重放一轮 merge，
    # 还产不产得出来。合并不了说明值只存在于那一个文件里，任何一次手工编辑都不可追溯。
    #
    # 为什么必须有机器守卫：这道缺口活了整整一程，靠的是「大家都以为别人在管」。
    # 实测过一次它的隐蔽性 —— 另一个重放工具（audience-rebuild.js）报 0/0 全绿，
    # 因为它把六字段当输入原样传过去，只验了策展那半边。没有独立断言就会重演。
    - name: Reproducibility gate (no value without a source)
      shell: bash
      run: node scripts/tools/check-reproducible.js

    # 历史一致性门禁（v1.4 新增）：`deal-history.json` 必须与当前 `deals.json` 自洽。
    #
    # 与上面那条同一条纪律，只是换成了时间维度：可重建性问「这个值是谁说的」，
    # 这一条问「这个值是怎么变过来的」——把一次性基线 + 追加事件重放一遍，
    # 必须逐字段等于今天的 deals.json；链断裂 / 记录静默消失 / 未跟踪字段进日志都必红。
    #
    # 为什么必须有它：没有它，历史就是一段自说自话的文本，谁都能往里写一条
    # 「X 在 9 月 1 日改过」，而页面与构建全绿。人类读不出这种差异，机器可以。
    - name: History verify (log consistent with deals.json)
      shell: bash
      run: node scripts/tools/history-verify.js

    # 迁移验收（2026-09-29 收口补）：`migrate.js --audience` 会给存量数据补 provenance，
    # 而它是**能改写 deals.json 的命令行工具**——判据只有一处实现（lib/migrate-audience.js）。
    #
    # 为什么现在才接进来：它此前**跑不起来**，卡点是「缺 --before 基线文件」。当时只有
    # 「把某次真实迁移前后的整份 deals.json 冻进仓库」这一条路，而那条路覆盖不足
    # （真实数据里 verified:false 的策展记录一条都没有，curated 那一档根本没人走）
    # 且会随 schema 演进腐烂。改成 9 条**合成夹具**逐分支覆盖后，代价降到可以接受。
    #
    # 它在第一次跑之前就抓到了一个**潜伏缺陷**：`dedup.credibilityOf` 早已加固成
    # 「editorial 要求来源也是策展」，而 lib/migrate-audience.js 当时还在用
    # 「verified + verifiedAt 就升级」——同一个洞只堵了一半，而 validateDeal 两种档位
    # 都放行，不会有任何东西变红。夹具的第 4 条就是它。
    - name: Migration verifier (audience provenance backfill)
      shell: bash
      run: node scripts/tools/migrate-audience-verify.js

    # 译文门禁（2026-09-28 起是**硬门禁**，此前只是建议性）：
    #   漂移（孤儿 / 原文已变 / 不合法 / 覆盖层管不到）= 必红，没有宽限期；
    #   待译 = 按年龄判，超过宽限期（默认 7 天）转红，数量与「最老 N 天」每次都打印。
    # 为什么必须硬：软门禁等于没有门禁——线上可能正拿着一份与英文对不上的中文，
    # 而 CI 一路绿灯。为什么不能要求待译为 0：自动采集每天两次，那会让系统长期停在
    # 「有新优惠 → 必然 CI 红」（2026-09-28 e01dcfc 实测）。
    - name: Translation gate (drift blocks, pending ages out)
      shell: bash
      run: node scripts/tools/zh-todo.js --check

    - name: Translation self-test
      shell: bash
      run: node scripts/tools/zh-selftest.js

    - name: Expiry self-test
      shell: bash
      run: node scripts/tools/expiry-selftest.js

    - name: Text / cleanText self-test
      shell: bash
      run: node scripts/tools/text-selftest.js

    - name: Source-health self-test
      shell: bash
      run: node scripts/tools/health-selftest.js

    # v1.3 信息来源（evidence / provenance）自测：零依赖、离线、秒级。
    # 为什么进门禁：这一层管的是**引文的版权红线**（条数 / 字数 / 全库预算）与
    # 「最近成功采集」四种状态的语义。它们失效时的表现全是「页面正常、构建正常」——
    # 实测已经踩过一次：`known` 没被单独放行，每条真采到的记录都渲染成「未知」，
    # 而当时构建自检全绿。这里没有别的步骤会替它红，所以必须进来。
    - name: Provenance self-test
      shell: bash
      run: node scripts/tools/provenance-selftest.js

    # v1.4 变更记录自测：零依赖、离线、秒级。
    # 它盯的是这一层赖以成立的全部承诺：只记重要字段（description / lastSeen / zh 变化 → 0 事件）、
    # 有锚点、链可重放、来源失败时**不**误报「消失」、超限必红不自动截断。
    # 判断标准与上面几支相同：它红的时候没有别的步骤会替它红。
    - name: Deal-history self-test
      shell: bash
      run: node scripts/tools/history-selftest.js

    # v1.5 变化雷达自测：零依赖、离线、秒级。
    # 它盯的是这一层赖以成立的全部承诺：五个分栏各自取什么、窗口边界在哪、
    # 窗口内的事件一条不漏、普通文案改写不算重大变化、元信息不上首页、超限不删数据、
    # 纯函数（不读时钟 / 不联网 / 零依赖）、墓碑与「日志不可用」各有各的说法。
    # 判断标准与上面几支相同：它红的时候没有别的步骤会替它红。
    # （产物级别的对账在 build-local 的产物自检里，两者互补：这一支管规则本身。）
    - name: Change-radar self-test
      shell: bash
      run: node scripts/tools/changes-selftest.js

    # v1.7 SEO 门禁自测：零依赖、离线、秒级。
    # 它盯两件事，两件都必须用跑出来的结果回答：
    #   ① **27 个检查码每一条都真的会响**（逐个定向篡改，断言对应 code 出现）——
    #      一个永远不响的检查码比没有检查码更糟，因为它看起来在守着什么；
    #   ② 未篡改的干净夹具 0 个问题（否则「永远报错」也能通过 ①）。
    # 另含门槛函数的分支演练与注册表不变量（slug 表 / 钉住表 / 别名表 / 排除表）。
    - name: SEO self-test
      shell: bash
      run: node scripts/tools/seo-selftest.js

    # 受众字段（学生 / 开发者数据模型）自测：零依赖、离线、秒级。
    # 为什么必须进门禁（v1.1 补，由 t1 核验的 B5 发现）：这个自测原先只在本机跑，
    # 于是「三态措辞漂移 / merge 低可信覆盖高可信 / 假出处」这几类回归在 CI 里**看不见**
    # —— 而它们恰好是本阶段全部红线的守卫。判断一个自测该不该进门禁的标准不是"它多新"，
    # 而是"它红的时候，有没有别的步骤会替它红"：这里没有，所以必须进来。
    - name: Audience self-test
      shell: bash
      run: node scripts/tools/audience-selftest.js

    # t16/t18 新增：数据文件注记 ↔ 渲染措辞的自测（零依赖、离线、秒级）。
    # 为什么必须进门禁：`scripts/data/official_urls.json` 的 `_roles` 注里写着「② deal.sourceUrl /
    # plan.sourceUrl = 收录渠道（渲染成「原始出处」行）」，而 deal 侧那一行的标签早在 t7 就改成了
    # 「收录渠道」（audience.js 的 SOURCE_LABELS.origin）—— 注记是**自我声明**：写错了页面照常、
    # 构建照常、别的步骤全绿，只有读它的人被误导（t8 复核发现、t16 校正、t18 装进这里）。
    # 它红的时候没有别的步骤会替它红：audience-selftest 只锁「前端副本与 lib 一致」，
    # 不锁「数据文件的注记有没有跟着改」。同一形状（注记逐字引用会变的措辞/路径）以后照此办理。
    - name: Roles-note self-test (official_urls note vs live wording)
      shell: bash
      run: node scripts/tools/roles-note-selftest.js

    # 采集机器人身份（GitHub App token）自测：零依赖、离线、秒级。
    # 为什么进门禁：这条凭据链是**无人值守采集的命门**，写错的症状是「每天两次静默失败」
    # 或「换了不该换的身份去推送」，而本地一切正常。它盯三件事：JWT 不超过 10 分钟上限、
    # 三步的 Authorization 都是 App JWT、token 只进 $GITHUB_OUTPUT 且先 add-mask。
    - name: App-token self-test
      shell: bash
      run: node scripts/tools/app-token-selftest.js

    # v2.0 新增：AI 层边界自检（离线、零依赖、不读任何 API key）。
    # 为什么必须进门禁：这一层守的是本版本全部红线的**结构性**部分 ——
    # 「没有证据的断言进不来」「非法枚举进不来」「AI 挂了确定性链路不变」
    # 「候选里出现密钥会被扫出来」「去重模块根本没有合并能力」。
    # 这些判据的失效方式全都是**静默的**（页面照常、构建照常），
    # 没有别的步骤会替它红；而它们一旦失效，AI 的建议就会开始悄悄改写生产数据。
    - name: AI layer self-test
      shell: bash
      run: node scripts/tools/ai-selftest.js

    # v2.0 新增：采集器 fixture 回放（离线）。
    # 它把"解析器的行为"钉成契约：4 份最小 DOM 片段 + 解析器期望输出。
    # 有了它，改采集器（无论人改还是 AI 出补丁）才有可判定的回归判据 ——
    # 否则唯一的判据是"跑一遍真实页面看看还有没有数据"，那等于把测试建立在第三方的可用性上。
    - name: Collector fixtures (offline replay)
      shell: bash
      run: node scripts/tools/fixture-test.js

    # v2.1 新增：Coding Plan 数据模型（plans.json）与套餐对比页的离线自测。
    # 它红的时候没有别的步骤会替它红 —— 「requests 套餐不得生成 Token 单价」「限速套餐不得写
    # 固定额度」「原价未知不得填 0」「改价不得换 id」「同平台同套餐不得有两条身份」
    # 「三态不得与 false 混用」「聚合站出处不得当证据」「页面上不许出现结论性词汇」
    # 「算不出的单价必须显示成 —」「未知必须显示成未标注」这些承诺只在这一步被逐条验证。
    - name: Plans self-test (data + page)
      shell: bash
      run: node scripts/tools/plans-selftest.js

    # v2.3 新增：套餐变化日志自测（零依赖、离线、秒级）。
    # 它盯的是这一层赖以成立的全部承诺：只记重要字段（lastSeen / verifiedAt / evidence /
    # 量化型套餐的 description 变化 → 0 事件）、**数组顺序变化不产生事件**、
    # 值决定类型（活动价开始/结束/换挡、额度增减 vs 口径变化、模型增删 vs 权限变化）、
    # Stable event ID（派生值，手写必红）、**一次没见到不算下线 + 批量消失熔断**、
    # 重复运行不重复产生事件、时间只来自数据（日期倒填被拒）、链与上限必红，
    # 以及「机制只有一份实现」（静态扫描 history-core 的边界）。
    # 判断标准与上面几支相同：它红的时候没有别的步骤会替它红。
    - name: Plan-history self-test
      shell: bash
      run: node scripts/tools/plan-history-selftest.js

    # v2.4 新增：优惠 ↔ 套餐关系自测（零依赖、离线、秒级）。
    # 它盯的是这一层赖以成立的承诺：关系必须指向**真实存在**的记录（不存在的 id 硬红）、
    # provider 必须一致或有明确 override（认得出却多写 override 也要红）、状态只看数据与基准日
    # （同数据换基准日结论随之变化 → 证明没读墙上时钟）、**已结束的优惠永远不能显示成「当前优惠」**、
    # 节省金额四道门（同套餐/同币种/同周期/全员可享）缺一不可、派生值不得落盘、
    # 候选报告没有任何写生产关系的代码路径。判断标准与上面几支相同：它红的时候没有别的步骤会替它红。
    - name: Deal-plan-links self-test
      shell: bash
      run: node scripts/tools/deal-plan-links-selftest.js

    # v2.5 新增：API / Token 计费自测（零依赖、离线、秒级）。
    # 它盯的是这一层**与订阅套餐不同的那些承诺**：单位永远显式且全仓没有换算路径
    # （把每千换成每百万会让两个口径不同的数字看起来可比）、**credits 是钱不是 token**
    # （结构上写不进 token 数量，页面上也不折算）、输入价与输出价分列（渲染层互换会被逐格对账抓住）、
    # 模型改名保持 modelKey 时产生零事件而换 modelKey 时必须被检测出来，以及这四条都**实跑变红**。
    # 判断标准与上面几支相同：它红的时候没有别的步骤会替它红。
    - name: API-plans self-test (data + page)
      shell: bash
      run: node scripts/tools/api-plans-selftest.js

    # v2.5 新增：api-plans.json 可重建性（人工来源层 → 派生文件，逐字节）。
    # 与 plans 那一条红的含义相同：问的是「有没有人手改了派生产物 / 改了来源层却忘了重建」。
    - name: API-plans reproducibility (curated → api-plans.json, byte-compare)
      shell: bash
      run: node scripts/tools/check-api-plans-reproducible.js

    # v2.5 新增：API 计费变化日志与当前数据的一致性（基线 + 事件重放必须等于今天的数据）。
    # 与 plan-history 那一条红的含义相同，只是换了一份数据与一套判据。
    - name: API-plan-history verify (log consistent with api-plans.json)
      shell: bash
      run: node scripts/tools/check-api-plan-history.js

    # ---- v3.0 新增：六个新页面家族与索引层，各自的离线自测 -------------------------------
    #
    # 判断标准与前面每一支相同：**它红的时候没有别的步骤会替它红**。
    # 例如「模型页只有在有 registry entry 且被引用时才生成」这条门槛、
    # 「厂商页的 API 计数必须与 api-plans 现算一致」、「/archive/ 的状态必须能从时间线重推」、
    # 「Manifest 的 count / updatedAt 必须与磁盘逐字段一致」—— 都只在这一步被验证。
    - name: Model-registry self-test (identity + explicit mapping)
      shell: bash
      run: node scripts/tools/models-selftest.js

    # v3.0 新增：索引层与关系层的可重建性（与 plans / api-plans 那两条红的含义相同）。
    - name: Models reproducibility (registry → models.json, byte-compare)
      shell: bash
      run: node scripts/tools/check-models-reproducible.js

    - name: Model-registry links check (explicit mapping only, no similarity)
      shell: bash
      run: node scripts/tools/check-model-registry-links.js

    # v3.0 新增：覆盖报告进门禁（独立完成度审查员指出的缺口）。
    #
    # 为什么必须进来：这份报告是「缺口清单」的**唯一**落盘处（有 Deals 无 Plans、有 Plans 无 Deals、
    # 有 API Pricing 无 Registry 映射、重要候选未采信），而它原先**不在任何门禁里**。
    # 实测后果：它内部把「来源层形状」当「派生层形状」读，于是把 44 个模型的注册表报成
    # 「尚未落盘（Stage D 未完成）」，**自检仍报 0 处问题** —— 一份在撒谎的报告可以永久静默存活。
    # 修好之后把它接进门禁：报告与数据对不上就红，避免同类假报告再次无声发生。
    - name: Coverage report (gap list consistent with data)
      shell: bash
      run: node scripts/tools/coverage-report.js

    # coverage-expansion-v1 新增：Coverage Target 层（覆盖意图层）与 report:coverage v2 的自测。
    # 这一层最该防的只有一件事：**"我声称覆盖了"与"盘上真的有"混成一格**。所以来源层只许写意图
    # （tier / role / 七态一律派生）。本步逐段钉住四件事：
    #   ① 真实文件与事实快照对账（provider / registrySlug / 来源必须真实存在、不许手写状态、
    #      不许重复键、身份层与意图层双向对账）；
    #   ② 七态派生逐条演练（DEFERRED / UNVERIFIABLE / NOT_APPLICABLE / BLOCKED_SOURCE **永不算 MISSING**）；
    #   ③ 牙：provider 不存在、registrySlug 不存在、来源编造、身份层少一行、缺复查条件……逐条必须红；
    #   ④ 端到端契约：report:coverage --json 两次逐字节一致、旧 JSON 键一个不少。
    # 判断标准与上面每一支相同：**它红的时候没有别的步骤会替它红**。
    - name: Coverage-targets self-test (intent layer + seven derived states)
      shell: bash
      run: node scripts/tools/coverage-targets-selftest.js

    # coverage-expansion-v1 新增：模型角色词表与派生状态的**契约守卫**（离线、秒级、零依赖）。
    # 为什么必须有它（真实事故，不是假想）：同一个枚举在本轮出现过**三套词表**
    # （题面 10 值 / 调研阶段的 9 值 / 被抄进 registry 的那一套），而档位表按另一套名字匹配。
    # 症状完全静默：角色名对不上档位 ⇒ 整批模型掉进兜底档 ⇒ 慢周期模型（embedding / translation）
    # 被过早判成 legacy ⇒ 默认隐藏，而所有页面、报告、构建照常全绿。
    - name: Model-role vocabulary self-test (registry ↔ freshness contract)
      shell: bash
      run: node scripts/tools/model-role-vocabulary-selftest.js

    # coverage-expansion-v1 新增：新鲜度判据（catalogStatus）的**分支自测**（离线、不读墙上时钟、
    # 不依赖任何生产数据文件 —— 数据还没迁移完的时候它就该能跑）。
    # 逐条钉住 current / aging / legacy / historical / unknown 每一种真的能派出来，
    # 以及四条硬不变量：跨 modelRole / family / developer 的记录绝不互相淘汰、
    # freshnessGroup 只影响写了它的那一条、每个比较组至少有一条默认可见、
    # **unknown 绝不自动等于 legacy**。这些承诺没有别的步骤会替它验。
    - name: Freshness self-test (catalogStatus branches)
      shell: bash
      run: node scripts/tools/model-freshness-selftest.js

    # coverage-expansion-v1 新增：阈值灵敏度（±90 天扰动）—— 照妖镜式的检查，不是"再跑一遍策略"。
    # 120/240、180/365、365/730 三档是**候选值**不是拍板值；这一步回答两件事：
    #   ① 哪些模型会换档（current ↔ aging ↔ legacy）；
    #   ② 有没有比较组整组掉到 0 个默认可见状态 —— 那等于整族从默认目录里消失，
    #      而**不会有任何门禁报红**（legacy / historical 本来就是设计成隐藏的）。
    # 退出码 0 = 基线不变量成立（扰动结果只是"数据"）；1 = 基线自相矛盾（不变量违规 / 重复 slug / 非法输入）。
    - name: Freshness threshold sensitivity (±90 days, baseline invariants)
      shell: bash
      run: node scripts/tools/model-freshness-sensitivity.js

    # 发布产物由 build-local.js 组装（与 deploy.yml 完全同一条路径），
    # 失败即拦：能装出坏产物就不该合并、更不该发布。
    - name: Assemble site (same path as deploy.yml)
      shell: bash
      run: node scripts/tools/build-local.js

    # ---- 产物依赖的五个页面自测：**排在 Assemble site 之后** -----------------------------
    #
    # 为什么顺序变了（§10.9 / P2-10 / P2-26）：这五节都要读 `dist/` 现场，而它们原先排在
    # 构建**之前** —— CI 的干净检出里 `dist/` 不存在（dist/ 是 gitignore 的），于是这五节
    # 全部走「缺产物 ⇒ 跳过并计 ✓」那个出口：同一份代码在本地与 CI 的项数不同，而这些牙
    # 在 CI 里**一次都没跑过**。现在：先构建，再让它们在**明确的产物**上跑，并显式传
    # `--dir=dist`（不是让每个测试自己猜"构建应该存在吗"）；缺产物一律非 0 —— 只有本地
    # 诊断才加 `--allow-missing-dist`（会打印 OPTIONAL DIAGNOSTIC）。
    # 这个调用形态与顺序由 `check-ci-consistency` 的 (10)/(17) 守着。
    - name: Models-page self-test (index + detail pages)
      shell: bash
      run: node scripts/tools/models-page-selftest.js --dir=dist

    - name: Plans-hub self-test (/plans/)
      shell: bash
      run: node scripts/tools/planshub-selftest.js --dir=dist

    - name: Vendor-pages self-test (/vendor/)
      shell: bash
      run: node scripts/tools/vendor-page-selftest.js --dir=dist

    - name: Archive self-test (/archive/, synthetic ended/restored fixtures)
      shell: bash
      run: node scripts/tools/archive-selftest.js --dir=dist

    # private-analytics-v1 新增：私有站点分析（Cloudflare Web Analytics）的独立门禁。
    # 它红的时候没有别的步骤会替它红 —— 构建期那一遍的输入是「构建过程自己记下来的描述符」，
    # 而这一支**只读 dist/** 现场：自己推导路由、自己数 `data-dsh-analytics`、把
    # `lib/analytics.js` 的 guard 区块拿进 vm 沙箱真的执行一遍真值表。
    # 覆盖的是本轮全部红线：每页 exactly 1 个 bootstrap（多一个/少一个都红）、
    # localhost / 127.0.0.1 / file:// / 同域其它项目必须禁用、
    # 注入内容与唯一配置源逐字节一致、产物里不许有 traffic.json / analytics.json、
    # 不许出现别的分析 provider、仓库里不许有 Cloudflare **账户**凭据
    # （合法的 browser Site Token 刻意不被算作泄密）。
    # 另含 8 种定向篡改的牙测试：任何一种篡改没被扫出来，这一步就红。
    - name: Analytics self-test (bootstrap count / production guard / provider)
      shell: bash
      run: node scripts/tools/analytics-selftest.js --dir=dist

    # secondary-page-residue-v2 新增：**「删掉不许回流 + 扫描面不许收缩」的产物级复核**。
    #
    # 判据本体只有一份（`build-local.js` 的 `scanResidue()`），这一步通过 `check-residue.js`
    # `require` **同一个函数**，不复制逻辑 —— 复制的判据会在两处漂移，而漂移掉的那一侧
    # 永远是没人看的那一侧。
    #
    # 为什么构建期已经跑过还要单列一步：构建期那一遍是**主守卫**（每次构建都跑，含
    # `RESIDUE_MIN_ENTRIES` 的缩表检查），撞上它最快；但它**只能在构建那一刻判**，
    # 而「产物在那之后有没有被人手改、有没有被塞回一段已删文案」只有对着**已就绪的产物**
    # 再判一次才发现得了。此外这一步给出的 `--dir=<沙箱>` 是「不动真产物就能做变异演练」
    # 的唯一入口（adversary 靠它做对抗复核，见
    # research/_raw/secondary-page-residue-v2/mutation/README.md）；
    # 把它拿掉，判据还在，但**没人能在不重建的前提下证伪它**。
    # ⚠️ 合并说明：本条之前原有一支 `Feeds reproducibility`（真实构建两次、逐字节比对
    # Feed 产物），它随「去数据暴露」那一轮整体下架一并删除 —— 合并 origin/master 时按
    # 「保留对方的 Residue guard、丢弃 Feeds 那一支」解决冲突（Feed 产物已不存在，留着只会红）。
    - name: Residue guard (deleted copy must not return; container floors)
      shell: bash
      run: node scripts/tools/check-residue.js --dir=dist

    # v2.1 新增：plans.json 可重建性 —— 盘上那份必须等于人工来源层产出的那一份（逐字节）。
    # 它问的是「有没有人手改了派生产物 / 改了来源层却忘了重建」。
    # （t2 删掉了原先那句「与上一条红的含义不同：Feeds 那条问的是构建产物里有没有被塞进时钟」——
    #  被引用的 `Feeds reproducibility` 步骤随订阅层整体下架一起删除，留着一句指向不存在步骤的
    #  对照只会让下一个人去找一个已经不存在的门禁。）
    - name: Plans reproducibility (curated → plans.json, byte-compare)
      shell: bash
      run: node scripts/tools/check-plans-reproducible.js

    # v2.3 新增：套餐变化日志与当前 `plans.json` 的一致性门禁。
    # 与上一条红的含义不同：Plans reproducibility 问的是「文件是不是来源层产出的那一份」，
    # 这一条问的是「这份数据是怎么变过来的」——把一次性基线 + 追加事件重放一遍，
    # 必须逐字段等于今天的 plans.json；链断裂 / 记录静默消失 / 未跟踪字段 /
    # 手写 eventId / 观测期外的缺席都会在这里红。
    # 没有它，「套餐变化」就是一段谁都能往里面写一条的文本，而页面与构建全绿。
    - name: Plan-history verify (log consistent with plans.json)
      shell: bash
      run: node scripts/tools/check-plan-history.js

    # v1.7 SEO 独立验收：从**产物**出发（页面 HTML / sitemap.xml / 目录结构 / 产物里那份首页
    # 数据资源 `assets/data/offers.json`），把可索引性、条目集合、sitemap 成员重新推导一遍，
    # 再与页面上的标记逐个对账。
    # 为什么构建期那一遍不够：那里的描述符是构建过程自己记下来的，一个错误的判据会在两边
    # 一致地错下去。这一支的价值在**重算 + 与产物对账**，不在「真值来自哪一份文件」——
    # t6 起四份已下架的数据（plans / api-plans / models / model-registry-links）改从仓库根读。
    - name: SEO verification (independent, from dist/)
      shell: bash
      run: node scripts/tools/seo-verify.js

    # 浏览器准备：**这一步不判死**，只负责"把有没有浏览器弄清楚"。
    # 判死放在后面的「浏览器可用性判定」里，好处是失败原因写在一处，
    # 且无论是 playwright 装的还是 runner 自带的浏览器，都在同一条判定线上。
    # 末尾显式 `exit 0`：本 action 刻意不用 continue-on-error，行为要自己写清楚。
    - name: Prepare browser for the real-browser gate
      id: browser
      shell: bash
      run: |
        set +e             # 安装/探测失败都要走到"明确报错"分支，不中途退出（默认的 bash -e 会）
        set -uo pipefail

        PW_VERSION=$(node -p "require('playwright-core/package.json').version")
        echo "playwright-core 版本: $PW_VERSION"

        # --with-deps 需要 sudo（GitHub runner 有）；装不上就退到 runner 自带浏览器
        npx --yes "playwright@$PW_VERSION" install --with-deps chromium \
          || echo "::warning title=chromium 安装失败::npx playwright install chromium 未成功，继续探测系统自带浏览器"

        # playwright-core 期望的内核路径（版本严格对应，最优先）
        PW_EXE=$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())" 2>/dev/null || true)

        # 退路：GitHub 的 ubuntu 镜像自带 google-chrome / microsoft-edge
        EXE=""
        for cand in "${PW_EXE:-}" /usr/bin/microsoft-edge /usr/bin/google-chrome \
                    /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser /snap/bin/chromium; do
          if [ -n "$cand" ] && [ -x "$cand" ]; then EXE="$cand"; break; fi
        done

        if [ -n "$EXE" ]; then
          echo "browser_available=true" >> "$GITHUB_OUTPUT"
          echo "executable=$EXE" >> "$GITHUB_OUTPUT"
          echo "浏览器可执行文件: $EXE"
        else
          echo "browser_available=false" >> "$GITHUB_OUTPUT"
          echo "executable=" >> "$GITHUB_OUTPUT"
          echo "没有找到可用的浏览器可执行文件"
        fi

        {
          echo "### 真浏览器验收 · 浏览器准备"
          echo ""
          if [ -n "$EXE" ]; then
            echo "- 可执行文件：\`$EXE\`"
            echo "- 结论：✅ 浏览器就绪，verify-site.js 会**真实执行**。"
          else
            echo "- playwright-core 期望路径：\`${PW_EXE:-<空>}\`（不存在或不可执行）"
            echo "- 已逐个探测：playwright chromium、microsoft-edge、google-chrome、chromium（/usr/bin 与 /snap/bin）"
            echo "- 结论：⚠️ **没有可用的浏览器可执行文件**。这一步本身不判死，"
            echo "  下一步「浏览器可用性判定」会按明确规则处理——默认**直接失败**，绝不静默变绿。"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        exit 0

    # 「浏览器不可用」的**降级判定**：写在这里而不是写成 job 级 if ——
    # job 级 if 一旦跳过，该 job 的检查**报 Success**（没跑却算过）——对门禁而言这是最坏形态。
    # 步骤内判死：默认失败；只有人工显式降级才放行。
    - name: Browser availability decision (never silent)
      id: decision
      shell: bash
      run: |
        set -uo pipefail
        AVAIL='${{ steps.browser.outputs.browser_available }}'
        EXE='${{ steps.browser.outputs.executable }}'
        ALLOW='${{ inputs.allow_degraded_run }}'

        if [ "$AVAIL" = "true" ]; then
          echo "mode=full" >> "$GITHUB_OUTPUT"
          echo "浏览器可用（$EXE）→ 真浏览器验收将执行"
          {
            echo ""
            echo "- 判定：**真浏览器验收将执行**（verify-site.js + 回归比对，可执行文件 \`$EXE\`）"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        if [ "$ALLOW" = "true" ]; then
          echo "mode=degraded" >> "$GITHUB_OUTPUT"
          echo "::warning title=降级运行：本次没有做真浏览器验收::没有可用的浏览器可执行文件；因显式 allow_degraded_run=true，只跑静态门禁"
          {
            echo ""
            echo "### ⚠️ 降级运行：本次**没有做真浏览器验收**"
            echo ""
            echo "没有找到可用浏览器，且这次**显式**允许降级（人工触发）。"
            echo "被跳过的是 verify-site.js 的真浏览器断言（横向溢出 / 内容裁切 / 弹层 / 键盘无障碍 / 对比 / 390px…）。"
            echo "静态门禁（strict 校验、译文门禁、各个 selftest、产物自检）已照常执行。"
            echo ""
            echo "=> **这个绿灯不包含真浏览器验收**，不要当成完整门禁的依据。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        echo "mode=none" >> "$GITHUB_OUTPUT"
        echo "::error title=真浏览器验收无法执行::没有可用的浏览器可执行文件，且本次没有显式允许降级——门禁明确失败（不静默变绿）"
        {
          echo ""
          echo "### ❌ 真浏览器验收**没有执行** —— 明确失败"
          echo ""
          echo "没有找到可用的浏览器可执行文件（playwright chromium 与系统自带 chrome/edge 都不可用），"
          echo "而本次没有显式允许降级，所以这里**直接失败**，而不是给一个「没有验证过」的绿灯。"
          echo ""
          echo "处理办法："
          echo "1. 重跑本 job（多数情况是 npx 拉内核时的网络抖动）；"
          echo "2. 确认 runner 镜像里有 google-chrome / microsoft-edge；"
          echo "3. 确实只需要静态门禁时，人工 \`workflow_dispatch\` 并勾选 \`allow_degraded_run\`，"
          echo "   Summary 会留下「未做真浏览器验收」的明确记录。"
        } >> "$GITHUB_STEP_SUMMARY"
        exit 1

    # 真浏览器验收：只有判定为 full 才跑（degraded 时不跑，但上面已经明确记录了原因）。
    # verify-site.js 默认写死 Windows 的 Edge 路径，所以必须用它的 DSH_EDGE 覆盖成
    # runner 上真实存在的可执行文件——不然 Linux 上会直接 launch 失败。
    - name: Real-browser acceptance (verify-site.js)
      if: steps.decision.outputs.mode == 'full'
      shell: bash
      env:
        DSH_EDGE: ${{ steps.browser.outputs.executable }}
      run: node scripts/tools/verify-site.js

    # 回归比对：与 research/_raw/ours-baseline/verify.json（入库的冻结基线）比
    # 覆盖条数 / 卡片数 / 首屏完整可见条数 / 页高 / 外部请求 / JS 错误。
    # 代价写在 README：这几项「只能升不能降」，合法的数据缩减（过期下架、重新折叠）
    # 会拦发布，处置方式是**人工、留痕**地重刷基线（npm run verify:baseline）。
    - name: Regression verify (baseline compare)
      if: steps.decision.outputs.mode == 'full'
      shell: bash
      env:
        DSH_EDGE: ${{ steps.browser.outputs.executable }}
      run: node scripts/tools/verify-site.js --compare=research/_raw/ours-baseline/verify.json

    # 结论落 Summary（if: always() —— 前面的步骤红了也要把结论与"判了什么"写清楚；
    # 这一步只记录，不改变 job 的成败）。
    - name: Gate conclusion
      if: always()
      shell: bash
      run: |
        {
          echo ""
          echo "### 门禁结论"
          echo ""
          if [ "${{ steps.decision.outputs.mode }}" = "full" ]; then
            echo "- 静态门禁 + **真浏览器验收 + 回归比对**都跑了"
          elif [ "${{ steps.decision.outputs.mode }}" = "degraded" ]; then
            echo "- ⚠️ 只跑了静态门禁（**未做真浏览器验收**，显式降级）"
          else
            echo "- ❌ 真浏览器验收没有执行（见上一条注解与 Summary 顶部原因）"
          fi
          echo "- 触发事件：\`${{ github.event_name }}\` @ \`${{ github.ref }}\`"
        } >> "$GITHUB_STEP_SUMMARY"
