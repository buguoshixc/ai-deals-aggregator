name: Collect AI Deals

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 北京时间 08:00
    - cron: '0 12 * * *'  # UTC 12:00 = 北京时间 20:00
  workflow_dispatch:      # 手动触发

permissions:
  contents: write

# 防止两次采集重叠写 deals.json
concurrency:
  group: collect-deals
  cancel-in-progress: false

jobs:
  collect:
    # 钉死版本而不是 ubuntu-latest：无头浏览器依赖系统库，镜像换代容易踩坑
    # （ubuntu-latest 将于 2026-10-19 迁到 Ubuntu 26）
    runs-on: ubuntu-24.04
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate current data (before)
        run: node scripts/validate.js

      # 无头来源（智谱活动页 / 火山方舟）需要浏览器内核。
      # continue-on-error：装不上也不能拖垮整条已经稳定运行的静态采集链路——
      # 那种情况下无头来源会各自报错并产出 0 条，报告与 Summary 里都看得见。
      - name: Install browser for JS-rendered sources
        continue-on-error: true
        run: |
          PW_VERSION=$(node -p "require('playwright-core/package.json').version")
          echo "playwright-core 版本: $PW_VERSION"
          npx --yes "playwright@$PW_VERSION" install --with-deps chromium
          ls -d "$HOME/.cache/ms-playwright"/* 2>/dev/null || echo "(未安装内核)"

      - name: Run collectors (static + headless)
        run: |
          set -o pipefail
          node scripts/collect.js --headless 2>&1 | tee /tmp/collect.log

      - name: Validate new data (strict gate)
        run: node scripts/validate.js --strict

      # 采集报告落到 Summary：某次无头来源零产出时能立刻发现，不用翻日志
      - name: Publish run summary
        if: always()
        run: |
          {
            echo "### 采集结果"
            echo '```'
            grep -E "合计|火山方舟|智谱AI活动页|零产出|熔断|已写入|数据无变化|✗" /tmp/collect.log 2>/dev/null || echo "(无采集日志)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 更新优惠数据 $(date '+%Y-%m-%d %H:%M %Z')"
            git push
          fi
