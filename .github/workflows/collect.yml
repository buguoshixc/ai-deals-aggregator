name: Collect AI Deals

# 采集链路（P3 起）：采集 → 写盘 → **数据正确性硬门禁** → 提交 → **完整门禁（发布就绪 · 自动降级）**
# → 留痕 Summary →（workflow_run）由 deploy.yml 的严格门禁裁定是否发布。
#
# 为什么拆成两类门禁（2026-11-02 停更 6 天的教训）：「完整门禁」放在提交之前时，
# **任何一个发布就绪类检查**（真浏览器验收 / 产物自检 / 确定性构建 / SEO 对账）红一下，
# 数据就根本不入库 ⇒ 线上停版。现在两类门禁分开、各有明确判据：
#   · **数据正确性**（9 项，见下面的「Data correctness gate」）仍在提交**之前**硬拦，一条不松；
#   · **发布就绪**（完整 gate 本身）移到提交**之后**、`continue-on-error: true`（失败不阻塞入库），
#     并**自动**走 action 的降级通道（allow_degraded_run 写死 'true'，不再依赖人工勾选）；
#     它到底跑没跑、跳了哪几步，由紧随其后的「Release-readiness gate record」写进 Summary。
# 发布仍由 deploy.yml 的 prepublish 门禁**严格**裁定（该链不允许降级）——「数据入库」不等于
# 「发布放行」，线上只跟随 deploy 的结论。用的还是 `.github/actions/gate/action.yml`
# 那一个实现（与 verify.yml / deploy.yml 同源），没有第二套测试链。
on:
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 北京时间 08:00
    - cron: '0 12 * * *'  # UTC 12:00 = 北京时间 20:00
  workflow_dispatch:      # 手动触发
# P3 起 collect **自动降级**：发布就绪类失败不再阻塞数据入库，也不再需要「人工勾选降级」——
# 降级与触发方式无关（schedule / 手动都一样），而且必须在 Summary 里留痕（见最后的记录步骤）。
# 所以这里刻意**不再声明** allow_degraded_run 输入（check:ci 的 (11) 会守住这一点）。

permissions:
  contents: write

# 防止两次采集重叠写 deals.json
concurrency:
  group: collect-deals
  cancel-in-progress: false

jobs:
  collect:
    # 钉死版本而不是 ubuntu-latest：无头浏览器依赖系统库，镜像换代容易踩坑
    # （ubuntu-latest 将于 2026-10-19 迁到 Ubuntu 26）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 不持久化 GITHUB_TOKEN：推送改用下面换来的 App token。
          # 原因见 scripts/tools/app-token.js 顶部 —— github-actions（App ID 15368）是
          # **平台原生身份**，不是可安装的 GitHub App，因此**不能**被加进 ruleset 绕过名单
          # （API 422：Actor GitHub Actions integration must be part of the ruleset source
          # or owner organization）。master 一旦要求「必须走 PR + 必须过 gate」，
          # GITHUB_TOKEN 推送就会被挡下，而采集是无人值守的。
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # 机器人身份：换取专用 GitHub App 的 installation token。
      # 刻意放在最前面 —— 凭据没配好要在 10 秒内失败，而不是等一轮十几分钟的采集跑完，
      # 才发现最后一步推不上去。
      # 缺 Secret 时**明确失败**、不退回 GITHUB_TOKEN：退回会在 ruleset 生效后变成一句
      # 含混的 GH006，把真正的原因（凭据没配）藏起来。
      - name: Mint GitHub App token (robot identity)
        id: app
        run: node scripts/tools/app-token.js
        env:
          COLLECT_APP_ID: ${{ secrets.COLLECT_APP_ID }}
          COLLECT_APP_PRIVATE_KEY: ${{ secrets.COLLECT_APP_PRIVATE_KEY }}

      - name: Install dependencies
        run: npm ci

      - name: Validate current data (before)
        run: node scripts/validate.js

      # 无头来源（智谱活动页 / 火山方舟）需要浏览器内核。
      # continue-on-error：装不上也不能拖垮整条已经稳定运行的静态采集链路——
      # 那种情况下无头来源会各自报错并产出 0 条，报告、健康表与 Summary 里都看得见
      # （健康表会把它们判成 headless_unavailable 而不是 healthy）。
      #
      # ⚠️ `timeout-minutes` 是**必须**的，不是锦上添花（2026-10-07 实测踩到）：
      #   `continue-on-error` 覆盖的是「这一步**失败**」，**不覆盖「这一步卡住」**。
      #   当日 18:29Z 的定时采集卡在 `npx playwright install` 的下载上，把 job 级 30 分钟
      #   预算吃光后被判 cancelled —— 第 7 步 cancelled、第 8–11 步全部 skipped：
      #   静态采集一步都没跑，数据停了整整一天（run 37667276213）。
      #   有了上界之后，卡住 = 这一步在 8 分钟内失败 ⇒ continue-on-error 生效 ⇒ 采集照跑，
      #   无头来源降级为 headless_unavailable（这正是上面那段注释声明的意图）。
      #   取 8 的依据：最近 20 轮里 15 轮成功，**整轮**只要 3.0–6.5 分钟（含这一步），
      #   8 分钟对一次正常安装足够宽松，又把「卡死」的代价从「整轮报废」压到「少两个无头来源」。
      #   这条上界有牙：`check:ci` 的 (20) 会比对它与 job 级预算的大小。
      - name: Install browser for JS-rendered sources
        continue-on-error: true
        timeout-minutes: 8
        run: |
          PW_VERSION=$(node -p "require('playwright-core/package.json').version")
          echo "playwright-core 版本: $PW_VERSION"
          npx --yes "playwright@$PW_VERSION" install --with-deps chromium
          ls -d "$HOME/.cache/ms-playwright"/* 2>/dev/null || echo "(未安装内核)"

      - name: Run collectors (static + headless)
        run: |
          set -o pipefail
          node scripts/collect.js --headless 2>&1 | tee /tmp/collect.log

      # Codex 额度重置档案（B 包）：第三方 API → 严格校验 → 原子写 codex-resets.json。
      # 采集器自身 fail-closed（网络/解析/校验失败或条数骤降都不覆盖旧文件、exit 1）；
      # 这里 continue-on-error 的理由与下面「Failed sources (advisory)」同一套：**单个外部源
      # 失败是常态**，不能因为它阻断别的数据入库（数据正确性硬门禁在提交前，仍照常拦坏数据）。
      # 失败不静默：紧随其后的 if: always() 留痕步读 steps.codex_resets.outcome 与日志末尾。
      - name: Collect Codex quota resets (fail-closed)
        id: codex_resets
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -o pipefail
          node scripts/collectors/codex-resets.js 2>&1 | tee /tmp/codex-resets.log

      - name: Codex quota resets summary (advisory trace)
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### Codex 额度重置采集（fail-closed，不阻断数据提交）"
            echo '```'
            echo "outcome: ${{ steps.codex_resets.outcome }}"
            if [ -f /tmp/codex-resets.log ]; then
              echo "--- 日志末尾 20 行 ---"
              tail -n 20 /tmp/codex-resets.log
            else
              echo "(没有 /tmp/codex-resets.log —— 采集步骤没有执行或没有留下日志)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 每日静态校验：只跑 `checkMethod === "static"` 的 API 计费条目（裸 GET 可读的价目表）。
      # 价格未变 ⇒ **0 条历史事件**，只推进 lastVerifiedAt；价格变了 ⇒ 采纳新价 + 追加事件 +
      # 同步写出 api-plans.json。单源失败默认 exit 0（只有 --strict 才非 0），不拖垮采集链；
      # 内部不一致（schema / 历史写不进）才 fail-closed。详见脚本文件头。
      - name: Verify static API plans (daily)
        run: node scripts/tools/verify-api-plans.js

      # 派生层安全网：verifier 已经同步写过 api-plans.json；这里再跑一次重建，
      # 兜住「有人手改了 curated 却忘了重建」的形态（与 dev 的 npm run api-plans:rebuild 同一条命令）。
      - name: Rebuild derived api-plans.json
        run: node scripts/tools/rebuild-api-plans.js

      # CI 口径漂移门禁：裸跑（不带 --expect-checks），项数自动从 verify.yml 的那一行派生 ——
      # 数字只有一个出处，本地裸跑同样受保护。
      # 注：步骤名里不要出现「冒号 + 空格」，那是 YAML 的映射分隔符，会被真实解析器拒绝
      #（仓库自带的一致性检查用的是无依赖的缩进读取器，它读得过去，GitHub 读不过去）。
      - name: CI consistency (bare run — 期望项数从 verify.yml 派生)
        run: node scripts/tools/check-ci-consistency.js

      # 译文状态（**建议性**）：把清单写进 Summary，点开就能看到「哪几条要人管、最老多少天」，
      # 不必翻日志。它不参与数据入库判定（门禁里的 translation coverage 同样只报告、不判死）。
      - name: Translation status (advisory summary)
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### 中文译文状态"
            echo '```'
            node scripts/tools/zh-todo.js --check 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 来源失败清单（**建议性**，与译文状态同款）：单个采集器报错是常态而非异常——
      # 上面的浏览器安装步骤本身就是 continue-on-error，装不上时无头来源会各自报错并产出 0 条，
      # 那正是这条链路设计上要容忍的情形。所以它**不**阻断写盘，只把失败来源逐条写进 Summary。
      - name: Failed sources (advisory)
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### 采集来源失败清单（建议性，不阻断写盘）"
            echo '```'
            if grep -qE "^  ✗ " /tmp/collect.log 2>/dev/null; then
              grep -E "^  ✗ |^合计：" /tmp/collect.log || true
            else
              echo "本次没有采集器报错"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 采集报告落到 Summary：某次无头来源零产出时能立刻发现，不用翻日志。
      # 2026-09-28 起采集日志里多了「数据源健康（跨运行）」表与显式计数行
      # （修剪明细 / 来源明细 / 待译条数与最老天数），一并抓进来。
      - name: Publish run summary
        if: always()
        run: |
          {
            echo "### 采集结果"
            echo '```'
            # 「历史层 / 补记」两行 2026-11-12 起进 Summary：补记缺席的 ended 是「用既往证据
            # 补记」得到的，不是这一轮新攒够的两轮 —— 读者必须在运行摘要里看得见，而不是只看日志。
            grep -E "合计|来源失败|零产出|降级|已写入|数据无变化|译文不合规|修剪明细|来源明细|待译|历史层|补记|✗|❌" /tmp/collect.log 2>/dev/null || echo "(无采集日志)"
            echo '```'
            echo ""
            echo "### 数据源健康（跨运行）"
            echo '```'
            sed -n '/=== 数据源健康/,/^合计：/p' /tmp/collect.log 2>/dev/null || echo "(无健康表)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ─────────────────── 数据正确性硬门禁（必须在提交之前，一条不松） ───────────────────
      # 这 9 项是「数据本身对不对」的唯一判据：schema / 可重建性 / 历史自洽 / 迁移验收 /
      # 来源与变更记录 / AI 层 / 采集器 fixture。其中任何一项红都**不能入库** ——
      # 坏数据一旦进了 master，下一轮 deploy 会拿它去构建，而来源修复要等下一次采集。
      # 位置刻意紧贴提交步骤：只要它绿，这个提交就只可能包含「已通过数据正确性」的内容。
      # 不许加 continue-on-error、也不许加步骤级 if（check:ci 的 (13) 会红）：
      # 它是硬拦，不是建议；「发布就绪」类才允许失败（见提交之后的 gate）。
      # 原先独立的 `Validate new data (strict gate)` 一步已并入这里（同样是 --strict，口径不变），
      # 避免同一条命令在提交前跑两遍。
      - name: Data correctness gate (hard — blocks the data commit)
        id: data_gate
        run: |
          set -euo pipefail
          # 每行一条命令：日志里能直接看出是哪一层数据正确性红的。
          node scripts/validate.js --strict
          node scripts/tools/check-reproducible.js
          node scripts/tools/history-verify.js
          node scripts/tools/migrate-audience-verify.js
          node scripts/tools/provenance-selftest.js
          node scripts/tools/history-selftest.js
          node scripts/tools/changes-selftest.js
          node scripts/tools/ai-selftest.js
          node scripts/tools/fixture-test.js

      - name: Commit and push if changed
        id: commit
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          BOT_NAME: ${{ steps.app.outputs.bot_name }}
          BOT_EMAIL: ${{ steps.app.outputs.bot_email }}
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          # 四份跨运行状态与数据同批入库：
          #  · source-health.json —— 上次条数 / 连续失败次数，不入库就永远是「首次运行」，
          #    也就发现不了「某个源已经坏了几天」；
          #  · zh-pending.json    —— 每个待译字段**进入待译的日期**，不入库的话译文门禁的年龄
          #    只能退回 firstSeen，于是「上游改写导致老条目译文失效」会一失效就超期；
          #  · deal-history.json（v1.4）—— 变更日志。它必须与本轮 deals.json **同一批**入库：
          #    只写盘不提交的话，下一次采集的门禁会拿「已更新的 deals.json」去比「上次的日志」，
          #    check:history 当场变红并卡住整条采集链；反过来日志入库而数据没入，也同样自相矛盾。
          #    两者本来就是在同一次采集里成对产生的。
          #  · source-snapshots.json（v2.0）—— 每个来源两代**页面结构摘要**（不含页面正文）。
          #    不入库就永远只有"这一次"，而诊断要的恰好是"变之前 / 变之后"：
          #    「昨天 td=42、今天 td=0」这类最说明问题的证据只能靠跨运行留存。
          #    它只是**证据**：删掉它，采集/合并/构建的结果一字不变。
          #  · api-plans.json / curated_api_plans.json / api-plan-history.json（W1 起）——
          #    verifier 写入的 lastVerifiedAt、采纳后的新价与变化事件必须与数据同批入库；
          #    否则下一轮拿「已变的 curated」对「上一轮的历史」，check:api-plan-history 会红。
          git add deals.json scripts/data/source-health.json scripts/data/zh-pending.json scripts/data/deal-history.json scripts/data/source-snapshots.json api-plans.json scripts/data/curated_api_plans.json scripts/data/api-plan-history.json codex-resets.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            # [skip ci] 是必须的：App token 推的提交**会**触发 workflow（GITHUB_TOKEN 不会），
            # 不加这一句，同一个 SHA 上会同时触发 deploy.yml 的 push 链与 workflow_run 链，
            # 白跑一遍发布。发布只留 workflow_run 那一条 —— 它带着「上游采集是否成功」的
            # 显式判定，发布前还要再跑一次完整门禁。
            #
            # ⚠️ 这一句是**载荷假设**，别当装饰删掉、也别以为它会压住发布。官方原文
            #   `Skipping workflow runs`：「Skip instructions only apply to the `push` and
            #   `pull_request` events.」—— 它压掉的是 verify.yml(push) 与 deploy.yml(push)，
            #   **workflow_run 不受影响**，所以「Collect 跑完 → deploy 的 prepublish」照常。
            #   删掉它 = 白跑一遍发布；误以为它能拦 workflow_run 才会真停更。
            # 另注：被跳过的 workflow 其检查会停在 Pending（同一页文档明写），
            #   所以这个数据提交上 `gate` 永远 Pending —— 它在 master 上、没有 PR 要它，属预期。
            git commit -m "chore(data): 更新优惠数据、来源健康与变更记录 $(date '+%Y-%m-%d %H:%M %Z') [skip ci]"
            # 换用 App 身份推送（checkout 已用 persist-credentials: false，没有残留凭据）。
            # 这个 App 被单独列在 master ruleset 的绕过名单里 —— 只豁免机器人，不豁免人。
            git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push
          fi

      # ─────────────────── 发布就绪（自动降级 · 已不阻塞数据入库） ───────────────────
      # P3 起完整门禁放在**提交之后**，三个要点缺一不可：
      #   ① 数据已经入库（上面两步）：发布就绪类失败不再让整条链路红，不会重演
      #      2026-11-02 那次「门禁红 ⇒ 不提交 ⇒ 线上停版 6 天」；
      #   ② `continue-on-error: true` 是**载荷假设**，不是“让门禁变绿”：deploy.yml 的
      #      workflow_run 只在 Collect 结论为 success 时才放行（refuse 那一步显式判定），
      #      所以这里必须让 job 保持绿色 —— 否则一次浏览器故障就会冻结整条发布链。
      #      真正的发布裁定在 deploy 的 prepublish 严格门禁（那边任何事件都不许降级）。
      #   ③ `allow_degraded_run: 'true'` = **自动降级**（人工勾选入口已删除）：浏览器装不上时
      #      action 只跑静态部分，并在 Summary 里明确写「本次没有做真浏览器验收」。
      # 注意：仍在调用的同一个 action 实现（与 verify.yml / deploy.yml 同源），没有第二套测试链。
      - name: Release-readiness gate (after the data commit — never blocks storage)
        id: release_gate
        uses: ./.github/actions/gate
        with:
          allow_degraded_run: 'true'
        continue-on-error: true

      # ─────────────────── 发布就绪门禁的**留痕**（绝不静默降级） ───────────────────
      # 为什么需要这一步：上面的 gate 是 continue-on-error —— job 保持绿色，但「这一轮到底
      # 有没有做真浏览器验收 / 发布就绪类有没有红」必须写进 Summary，否则降级就是静默的。
      # 本步骤读不到复合 action 子步骤的内部结论（gate 没有暴露 outputs），所以它只如实报告
      # outcome，并把「哪几步没跑 / 为什么」指向 Gate 步骤日志与 Summary 原文（那里的
      # 「浏览器可用性判定」是唯一权威记录），绝不假装自己验证过。
      # 失败（含 skipped/cancelled）时额外发一条 ::warning 注解，保证在 Actions 页也看得见。
      - name: Release-readiness gate record (never silent)
        if: always()
        env:
          DATA_GATE_OUTCOME: ${{ steps.data_gate.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          RELEASE_GATE_OUTCOME: ${{ steps.release_gate.outcome }}
        run: |
          set -uo pipefail
          {
            echo ""
            echo "### 发布就绪门禁记录（数据入库 ≠ 发布放行）"
            echo ""
            if [ "$DATA_GATE_OUTCOME" = "success" ]; then
              echo "- **数据正确性硬门禁**：✅ 通过（提交前独立执行，共 9 项：validate --strict /"
              echo "  check-reproducible / history-verify / migrate-audience-verify / provenance-selftest /"
              echo "  history-selftest / changes-selftest / ai-selftest / fixture-test）。"
            else
              echo "- **数据正确性硬门禁**：❌ 结论为 '$DATA_GATE_OUTCOME' —— 数据**没有**入库（提交步骤不会执行）。"
            fi
            echo "- **提交/推送步骤结论**：'$COMMIT_OUTCOME'（success = 已推送，或本次数据无变化跳过提交；"
            echo "  skipped / failure = 数据未入库，见该步骤日志）"
            echo "- **完整 gate 结论**：'$RELEASE_GATE_OUTCOME'（success / failure / skipped / cancelled）"
            echo ""
            echo "发布就绪类检查项（本次结论以 Gate 步骤日志与 Summary 为准）："
            echo "- 真浏览器验收（verify-site.js）与回归比对"
            echo "- 产物自检（各 *-selftest 的 dist/ 断言、Residue guard）"
            echo "- 确定性构建（Feed / Plans reproducibility 的二次构建逐字节比对）"
            echo "- SEO 产物对账（SEO verification from dist/）"
            echo ""
            echo "**本次运行不声称「完整门禁全绿」。** 这些检查失败不再阻塞数据入库；"
            echo "若本次发生**自动降级**（浏览器不可用），Gate 内「浏览器可用性判定」会在本页写明"
            echo "「没有做真浏览器验收」以及跳过的是哪两步 —— 那就是「哪几步没跑 / 为什么」的权威记录。"
            echo "发布最终由 deploy.yml 的 prepublish 门禁**严格**裁定（该链不允许降级）；"
            echo "本次记录不构成对发布的放行。"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$RELEASE_GATE_OUTCOME" in
            success) ;;
            *)
              echo "::warning title=发布就绪门禁未通过（数据已入库）::Gate 结论 $RELEASE_GATE_OUTCOME；数据正确性已在提交前硬过并入库，发布由 deploy.yml 的 prepublish 严格门禁裁定"
              ;;
          esac
