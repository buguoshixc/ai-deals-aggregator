name: Deploy to GitHub Pages

# 纯发布流程：不做采集（采集由 collect.yml 负责），保证线上产物可复现。
#
# ⚠️ 这里必须同时监听 workflow_run：
#    GitHub 规定「用仓库自带 GITHUB_TOKEN 推送所产生的事件不会再触发其它 workflow」，
#    因此 collect.yml 里机器人提交 deals.json 后，push 事件不会唤醒本 workflow，
#    线上站点不会自动更新。监听「Collect AI Deals 跑完」才能补上这条链路。
#
# 2026-09-28 起：**发布链自己先过完整门禁**。
#   此前 gate（verify.yml）与 deploy 是两条互不相干的并行链：`build` 的 if 只看 Collect
#   的结论，而第一句 `github.event_name != 'workflow_run'` 让每一次人工 push 都无条件发布
#   —— 线上实证：e01dcfc 上 `gate=failure` 而 `build`/`deploy=success` 照发。
#   现在 job 顺序是 `prepublish`（跑 .github/actions/gate，与 PR 路径同一个文件）
#   → `build` → `deploy`，门禁红则 build/deploy **根本没有机会执行**。
#
# ⚠️ prepublish **绝不加 job 级 if**：被 if 跳过的 job 报 Success（没跑却算过）。
#   「采集失败就不发布」改由**步骤内的显式判定**承担（见 prepublish 的第一步）：
#   它失败时 build 因 needs 而跳过 —— 而真正拦住发布的是「没跑 prepublish 就没有 build」。
on:
  push:
    branches: [ master ]
  workflow_run:
    workflows: ["Collect AI Deals"]
    types: [ completed ]
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 发布前的完整门禁：与 verify.yml 的 gate 跑**同一个复合 action**。
  # 采集链路（workflow_run）上 verify.yml 根本不跑（机器人 push 不触发 workflow），
  # 所以这里的门禁是那条链路上唯一的把关点。
  prepublish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # 「上游采集失败就不发布」的显式判定。
      # 写成步骤而不是 job 级 if：job 被跳过时报的是 Success，而这里要的是**明确失败**
      # —— 让「采集没过门禁所以这次不发布」在 Actions 页面上看得见、日志里说得清。
      - name: Refuse to publish when the upstream run failed
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "触发事件 ${{ github.event_name }}：无需检查上游采集结论"
            exit 0
          fi
          CONCLUSION='${{ github.event.workflow_run.conclusion }}'
          echo "上游运行：${{ github.event.workflow_run.name }} #${{ github.event.workflow_run.run_number }} → $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error title=上游采集未通过，拒绝发布::Collect AI Deals 的结论是 $CONCLUSION；本次不发布，线上保留上一份成功版本"
            {
              echo ""
              echo "### ⛔ 上游采集未通过 → 本次不发布"
              echo ""
              echo "- 上游运行：\`${{ github.event.workflow_run.name }}\` #${{ github.event.workflow_run.run_number }}"
              echo "- 结论：\`$CONCLUSION\`"
              echo "- 处理：线上继续保留上一份成功发布的版本；先修采集侧的问题，"
              echo "  需要重新发布时手动 \`workflow_dispatch\` 本工作流（它同样要先过完整门禁）。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "上游采集成功，继续跑发布前门禁"

      # 发布路径**永远严格**：不提供降级开关（allow_degraded_run='false'）。
      - name: Gate (same implementation as verify.yml)
        uses: ./.github/actions/gate
        with:
          allow_degraded_run: 'false'

  build:
    # 采集任务失败时（例如 strict 门禁没过）不发布，保留线上上一份好数据。
    # 这一行是**逐字冻结**的：check-ci-consistency.js 的断言 (7b) 会比对它的完整文本。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: prepublish
    # IndexNow 的 payload 在本 job 算出、由 deploy job 发出 —— 为什么拆成两处，
    # 见下面「Compute IndexNow payload」那一步的注释（发布链的 uses 集合是冻结的，
    # deploy job 里不能加 checkout，所以它跑不了仓库里的脚本）。
    outputs:
      indexnow_count: ${{ steps.indexnow.outputs.count }}
      indexnow_payload: ${{ steps.indexnow.outputs.payload }}
      indexnow_day: ${{ steps.indexnow.outputs.day }}
    # 钉死 runner 版本而不是浮动标签：镜像换代（2026-10-19 起 latest 迁 Ubuntu 26）
    # 不跟着漂，与 collect.yml / probe-sources.yml 一致。
    runs-on: ubuntu-24.04
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 同一条路径：本地 `node scripts/tools/build-local.js` 与 CI 完全一致。
      # 该脚本零外部依赖，所以这一步不需要 npm ci；需要依赖的是**门禁**那一步
      # （真浏览器验收要 playwright-core），它在 prepublish 里已经跑过了。
      - name: Validate data and assemble site
        run: node scripts/tools/build-local.js

      # IndexNow：算出「本次要通知搜索引擎哪些 URL」——判据是 sitemap 里 `<lastmod>` 等于今天的那些
      # （`lastmod` 是**数据日**，不是构建时刻：没有新数据的那天它不前进，于是这里算出 0 条、一次都不发）。
      #
      # 为什么**算**在这里、而**发**在 deploy job：
      #   · 发送必须在站点**已经上线之后**，否则爬虫可能拿到旧内容 —— 而「站点上线」只发生在
      #     deploy job 的 deploy-pages 之后；
      #   · 但 deploy job 里**不能** checkout：发布链的 `uses:` 集合是**冻结**的
      #     （check-ci-consistency 的断言 (2) 是多重集比对，再加一个 actions/checkout 立刻红），
      #     所以那个 job 的 runner 上没有仓库、跑不了 scripts/ 下的任何东西。
      # 于是分工是：这里用**仓库里的唯一实现**算出 payload，作为 job output 交给 deploy 去发 ——
      # 判据只有一份实现，deploy 那一步只负责转发一个字符串。
      - name: Compute IndexNow payload (delta from the sitemap)
        id: indexnow
        run: node scripts/tools/indexnow-payload.js --dir=dist --github-output="$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # IndexNow：把 build job 算好的 payload 发给 api.indexnow.org（发布链的最后一步）。
      #
      # 为什么放在这里：它跑在 deploy-pages **之后**，站点已经在线 —— 爬虫拿到的是新内容，
      # 而不是"通知已经发了、东西还没上线"。
      #
      # 为什么它**刻意不判死**：走到这里发布已经完成了。通知失败的后果是"晚一点被发现"，
      # 不是"线上是坏的" —— 所以失败只记 warning + Summary 原文，**不** exit 1。
      # 这与门禁里「浏览器不可用」那一步是同一条思路：失败必须**可见**，
      # 但判死的标准是"产物坏了没有"，不是"每一步顺不顺"。
      # 没有变更（count == 0）时整步跳过：空 urlList 是非法请求，发出去只会换回 400。
      - name: Notify IndexNow (best effort, after the site is live)
        if: needs.build.outputs.indexnow_count != '0' && needs.build.outputs.indexnow_count != ''
        env:
          INDEXNOW_PAYLOAD: ${{ needs.build.outputs.indexnow_payload }}
        run: |
          set -uo pipefail
          BODY_FILE="$(mktemp)"
          STATUS=$(curl -sS -o "$BODY_FILE" -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$INDEXNOW_PAYLOAD" || echo '000')
          BODY="$(head -c 300 "$BODY_FILE" 2>/dev/null || true)"
          rm -f "$BODY_FILE"
          echo "IndexNow 响应 HTTP $STATUS $BODY"
          {
            echo ""
            echo "### IndexNow 通知（在发布**完成之后**执行）"
            echo ""
            echo "- 提交 URL：${{ needs.build.outputs.indexnow_count }} 条"
            echo "- 判据日：${{ needs.build.outputs.indexnow_day }}"
            echo "- 端点响应：\`HTTP $STATUS\`"
            echo "- 这一步失败**不判死**：发布本身已经成功，这里只做记录"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$STATUS" in
            200|202) echo "IndexNow 已接收"; exit 0 ;;
          esac
          echo "::warning title=IndexNow 通知未成功::HTTP $STATUS $BODY（发布本身已成功，线上不受影响）"
          exit 0
