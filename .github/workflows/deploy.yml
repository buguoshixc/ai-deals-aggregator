name: Deploy to GitHub Pages

# 纯发布流程：不做采集（采集由 collect.yml 负责），保证线上产物可复现。
#
# ⚠️ 这里必须同时监听 workflow_run：
#    GitHub 规定「用仓库自带 GITHUB_TOKEN 推送所产生的事件不会再触发其它 workflow」，
#    因此 collect.yml 里机器人提交 deals.json 后，push 事件不会唤醒本 workflow，
#    线上站点不会自动更新。监听「Collect AI Deals 跑完」才能补上这条链路。
on:
  push:
    branches: [ master ]
  workflow_run:
    workflows: ["Collect AI Deals"]
    types: [ completed ]
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 采集任务失败时（例如 strict 门禁没过）不发布，保留线上上一份好数据
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 同一条路径：本地 `node scripts/tools/build-local.js` 与 CI 完全一致
      # 该脚本零外部依赖，因此无需 npm install，发布不再依赖网络抓取
      - name: Validate data and assemble site
        run: node scripts/tools/build-local.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
