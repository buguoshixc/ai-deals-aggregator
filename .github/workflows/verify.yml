name: Verify site (gate)

# 为什么要有这条 workflow（仓库过去只剩两条「没人看」的路）：
#   collect.yml  只在 schedule / workflow_dispatch 上跑（定时采集，不校验 PR）
#   deploy.yml   只在 master 的 push / workflow_run 上跑（只发布，不校验 PR）
# 结果是：pull_request 事件**一个 workflow 都没有**，本地十几个分支在合并前对 CI
# 完全不可见；而文档里大力宣传的重门禁（真浏览器断言、selftest:zh、selftest:expiry）
# 全都不在 CI 里。这条 workflow 补上这两件事：**PR 触发** + **把重门禁搬进 CI**。
#
# 2026-09-28 起的结构：门禁的**步骤实现只有一处** —— `.github/actions/gate/action.yml`
# （复合 action）。本文件、deploy.yml、collect.yml 都调用它，避免出现两套相似但不同的
# 测试链。为什么不是 reusable workflow：见 action.yml 头部那三条理由（检查名不能变、
# 「期望项数唯一出处」钉在本文件的一行 run: 上、新增 workflow 会牵动一串冻结断言）。
#
# ⚠️ 关键约束：这个 job 的**名字与 id 都必须是 `gate`**（分支保护的必需检查名就是它），
#   而且**永远不许有 job 级 if**：按 GitHub 官方语义，job 被 if 跳过时报的是 "Success"
#   —— 没跑却算过，对门禁而言是最坏形态。要判断"该不该出版/该不该拦"，就把判断写进
#   **步骤**里（见 action.yml 的「浏览器可用性判定」）：每次都必须真跑，要么绿、要么红。
#   `scripts/tools/check-ci-consistency.js` 的断言 (8) 与 (10) 分别守着这两件事。
#
# 触发面：
#   pull_request → master   分支在合并前就可见（本地分支推上来即可）
#   push         → master   合并后的落点也验一遍
#   workflow_dispatch       手动跑（另有仅手动可用的 allow_degraded_run 开关）
# 注：机器人用仓库自带 GITHUB_TOKEN 推的 deals.json 提交**不会**触发本 workflow
#     （原因见 deploy.yml 里 workflow_run 那段说明）。所以采集那条链路的门禁在
#     collect.yml 里自己跑（提交数据**之前**），发布那条链路的门禁在 deploy.yml 里自己跑
#     （发布**之前**）——本文件覆盖的是人类 PR / 推送，也正是分支保护要求的那一个。
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:
    # 只给手动触发用的降级开关：浏览器实在装不上时，仍可跑静态门禁，
    # 但会在 Summary 与注解里**明确写出「本次没有做真浏览器验收」**。
    # inputs 上下文只存在于 workflow_dispatch —— 也就是说 **PR / push 永远走严格路径**，
    # 不可能靠它把一条必需检查糊成绿色。
    inputs:
      allow_degraded_run:
        description: '浏览器不可用时仍跑静态门禁（会在 Summary 明确记「未做真浏览器验收」）'
        type: boolean
        default: false

# 与 probe-sources.yml 同款最小权限：本 workflow 只读仓库、不写任何东西。
permissions:
  contents: read

# 同一 ref 上新的运行取代旧的：被取代的那次报的是 **cancelled**，不在 success / skipped / neutral 之列。
#
# ⚠️ 2026-10-08 起：**master 上不再取消**（ci-master-gate-concurrency-v1 的取证与裁定）。
#   实测（`research/_raw/ci-master-gate-concurrency-v1/`）：
#     · 历史 51 次 master gate：success 46 / cancelled 4 → 取消率不高，但**突发合并时是 100%**；
#     · 一次 5 次 master 推送（5.5 分钟内）的突发：4 次 gate 变 cancelled（其中一次已经跑了 4 分 04 秒
#       才被取消）、3 次 Deploy 因 pending 被后一次取代；
#     · 后果是「**合并提交本身**」的 gate 结论永久缺失 —— PR 级门禁验的是 `refs/pull/N/merge`（PR head
#       合进当时 base 的合成合并），不是最终落到 master 上的那个合并提交。突发合并恰恰是
#       「两个绿分支合起来语义冲突」最可能发生的时候，落点却没有结论，事后无法二分定位。
#   为什么可以排得动：仓库是 **public**（标准 runner 分钟不计费）；gate 实测耗时中位 207s、
#   最大 696s ⇒ 突发 k 次合并时，最新提交的结论最多晚 (k-1) × 中位值（不是无限增长）。
#   为什么 PR / 其它分支仍然取消：同一分支被 force-push 后，旧 run 验证的是一个不再存在的 head，
#   留着只会占并发与看板 —— 那里「取消」正是想要的语义。
#   回滚：把下面一行改回 `cancel-in-progress: true` 即可（其它文件都不用动）。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  gate:
    # name 与 job id 都钉成 `gate`：分支保护的必需检查名要对得上。
    name: gate
    # 钉死 runner 版本，与 collect.yml / probe-sources.yml / deploy.yml 一致
    # （浮动标签会在镜像换代时悄悄换掉浏览器与系统库）。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # CI 口径漂移门禁（脚本 scripts/tools/check-ci-consistency.js，零依赖 ⇒ 放在 npm ci 之前）：
      # ① 四个必需 workflow 写死并要求逐个存在（删/改名任一即红）；② uses 里没有 @v1..@v4（含 @v4.1.1
      #    这类点分写法）与 @main / @master 浮动引用（**按 40 位 SHA 钉死是允许且推荐的**；本地复合
      #    action 的 `./…` 引用单独识别，不算浮动）；③ 每个 workflow 的 uses 集合 = 各自的冻结集合；
      # ④ runs-on 与 node-version 跨 workflow 取值唯一（按**取值**与 **path** 判：注释里提到
      #    「*-latest 浮动标签」不算漂移；node-version 必须真的落在 setup-node 步骤的 with: 之下）；
      # ⑤ engines 下限从 package-lock.json 推导后比较；⑥ 守住 deploy.yml 的 workflow_run 桥接、
      #    build job 的 if、以及**发布链必须先过 gate**（prepublish 无 job 级 if + needs 关系）；
      # ⑦ 本文件的 on: 不得加 paths / paths-ignore —— 它要当必需检查，被路径过滤就不是「跳过」
      #    而是**永久 pending**；⑧ 守住 `.github/actions/gate/action.yml` 的**步骤序列**：谁把真浏览器
      #    验收从门禁里拿掉，这里立刻红；**同时冻结每个步骤的 run 体**（先剥注释再比对规范化后的
      #    命令：`run:` 换成 `echo skipped`、加 `continue-on-error`、加 `if: false` 全都会红），
      #    并**真实执行**"浏览器可用性判定"那段 shell（浏览器不可用 + 非逐字 'true' ⇒ 必须失败；
      #    逐字 'true' ⇒ 降级且必须留下明确记录）；⑧′ 产物依赖步骤必须显式 `--dir=dist` 且排在
      #    Assemble site **之后**（原先排在构建前，CI 干净检出里没有 dist/ ⇒ 那些牙一次都没跑过）；
      #    ⑨ collect.yml 的 gate 必须排在提交步骤之前；⑩ 末尾看门狗断言「断言名单与冻结清单等值」。
      # ⑪ 未加引号的标量里不得出现「冒号 + 空格」—— 那在块上下文里是映射分隔符，GitHub 的
      #    真实 YAML 解析器会拒绝整个文件（本仓库的缩进读取器读得过去，于是本地全绿、
      #    推上去什么都不跑；2026-09-28 实测踩到过一次，用 Python 的 YAML 解析器才发现）。
      # ⑫ 带外项数：`--expect-checks=38` 把「总项数」这个事实钉在**调用方**（本文件），因为看门狗
      #    保护不了自己被删（删掉它自己时项数会静默降 1 且仍 exit 0）。这个数字是**唯一出处**：
      #    脚本命令行不带参数裸跑（本地、以及 collect/deploy 里的裸跑）时也会回来读本行。
      #    注意这条 run **必须是单行**：读取器刻意跳过 `run: |` 块标量（fail-closed）。
      #    2026-10-01 由 32 提到 35：v2.0 新增三条 ——（0）与（2）各多一个必需 workflow
      #    （ai-maintenance.yml 登记进 REQUIRED_WORKFLOWS/FROZEN_USES），以及新的（16）
      #    「AI 维护链路只手动触发、只读仓库、只出 artifact」。
      #    2026-10-01 由 35 提到 36（v3.0 集成）：新增（17）新脚本登记制 ——
      #    package.json 里每个 `selftest:*` 的脚本文件都必须真的出现在门禁 action 里，
      #    堵住「写了自测、忘了接进门禁」这种**完全静默**的漂移（本地照样全绿）。
      #    2026-10-04（P1-2/P1-3/P2-26 收口）：**项数仍然是 36** —— 新增的判据折进既有断言
      #    （(10) 步骤体指纹 + 降级判定真实执行、(11) 降级输入按事件求值、(17) 产物依赖步骤
      #    的 --dir 与顺序），因为 `--expect-checks` 是被调用方钉住的口径，加断言就等于改口径。
      #    下面 `with.allow_degraded_run` 的取值不是靠 grep 字符串守的：(11) 会把它按触发事件
      #    **真的求值** —— 改成硬编码 'true' 会立刻让 check-ci 变红（PR / push 必须解析成 'false'）。
      #    2026-10-04（private-analytics-v1）由 36 提到 **37**：门禁新增一步
      #    「Analytics self-test (bootstrap count / production guard / provider)」，
      #    它同时登记进 GATE_STEP_NAMES / GATE_STEP_RUN / GATE_ARTIFACT_STEPS 三处。
      #    这一步是**真的多了一个断言项**（不是折进既有断言）：私有分析的红线
      #    —— 每页 exactly 1 个 bootstrap / localhost 与 127.0.0.1 零上报 /
      #    Production Guard 判据只有一份实现 / Cloudflare 账户凭据不许进仓库 ——
      #    没有任何既有步骤会替它红，所以它必须自己占一项。
      #    2026-10-04（t27）由 37 提到 **38**：新增（19）**反向登记制** —— 每个
      #    `scripts/tools/*selftest*.js` 都必须被**门禁真的跑到的** npm script 指向。
      #    为什么：上面那条（17）只守一个方向（package.json 的 selftest:* 都被门禁跑到）；
      #    反方向当时没人守 —— 自测文件已落盘却从 package.json 的登记链上被摘掉，
      #    它一次都不会执行，而检查器照样 exit 0（t7 的 D5 探针实测过；t14 独立审查
      #    也把它记为 T14-F3）。它和 (0b)「未登记的新 workflow 一律硬红」是同一条原则：
      #    登记制必须**双向**都有人守。豁免只能是逐文件 + 写明理由的白名单（当前为空）。
      - name: CI consistency (action / runner / node-version / engines drift)
        run: node scripts/tools/check-ci-consistency.js --expect-checks=39

      # 门禁本体：与 deploy.yml 的 prepublish、collect.yml 的提交前检查**同一个文件**。
      - name: Gate (validate → translation → selftests → build → real browser)
        uses: ./.github/actions/gate
        with:
          # workflow_dispatch 的 boolean 输入在 PR/push 上是空上下文，统一转成字符串
          # （复合 action 内部按 `[ "$ALLOW" = "true" ]` 比较）。
          allow_degraded_run: ${{ inputs.allow_degraded_run && 'true' || 'false' }}
